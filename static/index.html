<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Mango Store</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <h2 class="text-3xl font-extrabold text-gray-900 text-center mb-2">🥭 Rajshahi Mango Hub</h2>
        <p class="text-gray-500 text-center text-sm mb-6">Enter your details to pre-order next season's premium harvest.
        </p>

        <form id="orderForm" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Phone Number</label>
                <input type="text" id="phone" name="phone" required placeholder="e.g., 01711223344"
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none transition-all">
            </div>

            <div id="dynamicFields" class="space-y-5 hidden">
                <div id="welcomeMessage" class="p-3 rounded-lg text-xs font-medium"></div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Full Name</label>
                    <input type="text" id="name" name="name" required
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none bg-gray-50">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Delivery Address</label>
                    <textarea id="address" name="address" required rows="2"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Preferable Quantity (kg)</label>
                    <input type="number" id="quantity" name="quantity" required min="1" step="0.5"
                        placeholder="Enter weight in kg"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                </div>

                <button type="submit"
                    class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-all cursor-pointer">
                    Confirm Mango Order
                </button>
            </div>
        </form>
    </div>

    <script>
        const phoneInput = document.getElementById('phone');
        const dynamicFields = document.getElementById('dynamicFields');
        const welcomeMessage = document.getElementById('welcomeMessage');
        const nameInput = document.getElementById('name');
        const addressInput = document.getElementById('address');
        const orderForm = document.getElementById('orderForm');

        // Monitor input changes on the phone number field
        phoneInput.addEventListener('input', async (e) => {
            const phone = e.target.value.trim();

            // Check lookup once minimum length is hit
            if (phone.length >= 11) {
                try {
                    const response = await fetch(`/api/customer/${phone}`);
                    const data = await response.json();

                    dynamicFields.classList.remove('hidden');

                    if (data.exists) {
                        // Returning Customer Workflow
                        welcomeMessage.textContent = `🌟 Welcome back, ${data.name}! We've pre-filled your profile.`;
                        welcomeMessage.className = "p-3 rounded-lg text-xs font-medium bg-green-50 text-green-700 border border-green-200";

                        nameInput.value = data.name;
                        nameInput.readOnly = true; // Lock identity modification
                        addressInput.value = data.address; // Keep open for manual update adjustments
                    } else {
                        // Brand New Customer Workflow
                        welcomeMessage.textContent = "👋 New customer profile detected. Welcome onboard!";
                        welcomeMessage.className = "p-3 rounded-lg text-xs font-medium bg-blue-50 text-blue-700 border border-blue-200";

                        nameInput.value = "";
                        nameInput.readOnly = false;
                        addressInput.value = "";
                    }
                } catch (error) {
                    console.error("Profile lookup anomaly:", error);
                }
            } else {
                dynamicFields.classList.add('hidden');
            }
        });

        // Form Submit Handler
        orderForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(orderForm);

            // Handle disabled or read-only edge cases to guarantee values parse to backend
            if (nameInput.readOnly) {
                formData.set('name', nameInput.value);
            }

            try {
                const response = await fetch('/api/order', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (result.status === 'success') {
                    alert('🎉 ' + result.message);
                    orderForm.reset();
                    dynamicFields.classList.add('hidden');
                } else {
                    alert('Submission error: ' + result.detail);
                }
            } catch (error) {
                alert('Network connection error occurred.');
            }
        });
    </script>
</body>

</html>
